name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift-build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build Swift package
        run: swift build
